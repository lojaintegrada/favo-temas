name: Release theme

on:
  workflow_dispatch:
    inputs:
      theme:
        description: "Pasta do tema em themes/ (ex: litheme)"
        required: true
        type: string
      version:
        description: "Versão devolvida pela CLI do Favo (ex: 7)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
          THEME: ${{ inputs.theme }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          dir="themes/$THEME"
          log="$dir/CHANGELOG.md"
          tag="$THEME@$VERSION"

          [ -f "$log" ] || { echo "::error::$log não existe"; exit 1; }
          git rev-parse -q --verify "refs/tags/$tag" >/dev/null \
            && { echo "::error::tag $tag já existe"; exit 1; } || true

          # tudo entre "## Não publicado" e o próximo "## "
          notes=$(awk '/^## Não publicado/{f=1;next} /^## /{f=0} f' "$log" | sed '/^[[:space:]]*$/d')
          [ -n "$notes" ] || { echo "::error::nada sob '## Não publicado' em $log"; exit 1; }

          awk -v v="$VERSION" -v d="$(date +%F)" \
            '{print} /^## Não publicado$/{print ""; print "## " v " — " d}' \
            "$log" > "$log.tmp" && mv "$log.tmp" "$log"
          echo "$VERSION" > "$dir/VERSION"

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$log" "$dir/VERSION"
          git commit -m "release: $tag"
          git tag "$tag"
          git push --follow-tags

          zip="$THEME-$VERSION.zip"
          git archive --format=zip --prefix="$THEME/" -o "$zip" "HEAD:$dir"
          gh release create "$tag" "$zip" --title "$THEME $VERSION" --notes "$notes"
